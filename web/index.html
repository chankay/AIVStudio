<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 网剧流水线</title>
<link rel="stylesheet" href="/web/css/styles.css?v=1789439589">
</head>
<body>
<div class="layout">
  <!-- 左侧栏：品牌 + 导航 + 底部状态/退出 -->
  <aside class="sidebar">
    <div class="brand">
      <h1>AI 网剧流水线</h1>
      <span class="sub" id="modeTag">…</span>
    </div>
    <nav class="nav">
      <a href="#/projects" data-page="projects">📋 任务列表</a>
      <a href="#/new" data-page="new" class="nav-cta">✨ 新建任务</a>
      <a href="#/settings" data-page="settings">⚙️ 系统配置</a>
    </nav>
    <div class="sidebar-foot">
      <a href="#/settings" class="backend-mini" id="backendMini" title="模型后端状态，点击查看详情">
        <i id="backendDot"></i><span id="backendText">检测中…</span>
      </a>
      <button class="ghost" onclick="logout()">退出 ⎋</button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <!-- 面包屑（详情页显示） -->
    <div class="crumbs" id="crumbs" style="display:none;">
      <a href="#/projects">任务列表</a><span class="sep">/</span><span id="crumbTitle"></span>
    </div>

    <!-- 任务列表页 -->
    <section id="page-projects">
      <div id="listEmpty" class="card" style="text-align:center;color:var(--txt-3);padding:48px 20px;display:none;">
        还没有任务，去 <a href="#/new" style="color:var(--accent)">新建一个</a> 吧
      </div>
      <div id="projectList"></div>
    </section>

    <!-- 新建任务页 -->
    <section id="page-new" style="display:none;">
      <div class="card">
        <label>剧名</label>
        <input id="title" placeholder="例：城中村理发店">
        <label>一句话创意</label>
        <textarea id="idea" placeholder="例：一个失业程序员接手了父亲的理发店，在形形色色的客人身上重新理解生活"></textarea>
        <div style="display:flex; gap:16px;">
          <div style="flex:1;"><label>镜头数</label><input id="nshots" type="number" value="6" min="3" max="12"></div>
          <div style="flex:2;"><label>画风</label><input id="style" value="写实电影感"></div>
        </div>
        <label>分镜参考图（可选，火山定制版·多模态分镜）</label>
        <input id="refFiles" type="file" accept="image/*" multiple style="font-size:13px;">
        <div style="font-size:12px;color:var(--txt-3);margin-top:-6px;">
          传角色设定图或场景图，Seed-2.1-pro 会看着图写分镜——镜头描述与图中形象/场景严格对齐。最多 5 张。
        </div>
        <button id="btnCreate" onclick="createAndRun()">生成分镜并开跑</button>
        <span id="createMsg" style="font-size:12px;color:var(--txt-3);margin-left:10px;"></span>
      </div>
    </section>

    <!-- 任务详情页 -->
    <section id="page-project" style="display:none;">
      <div id="detailMissing" class="card" style="text-align:center;color:var(--txt-3);padding:48px 20px;display:none;">
        任务不存在或已被删除，<a href="#/projects" style="color:var(--accent)">返回列表</a>
      </div>
      <div id="detailBox" class="card"></div>
    </section>

    <!-- 系统配置页 -->
    <section id="page-settings" style="display:none;">
      <div class="card">
        <h3 style="margin:0 0 4px;font-size:16px;">模型后端配置</h3>
        <div style="font-size:12px;color:var(--txt-3);margin-bottom:10px;">修改后立即生效（无需重启服务）。Key 留空表示不修改。</div>
        <div class="health" id="health"></div>
        <div id="configBody"></div>
        <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end;">
          <button class="ghost" onclick="testAllBackends()" id="btnTestCfg">测试连通性</button>
          <button onclick="saveConfig()">保存</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 4px;font-size:16px;">账号安全</h3>
        <div style="font-size:12px;color:var(--txt-3);margin-bottom:10px;">修改密码后所有登录会话失效，需用新密码重新登录。密码至少 6 位。</div>
        <div class="cfg-grid" style="max-width:420px;">
          <label>旧密码</label><input id="pwOld" type="password" autocomplete="current-password">
          <label>新密码</label><input id="pwNew" type="password" autocomplete="new-password">
          <label>确认新密码</label><input id="pwNew2" type="password" autocomplete="new-password">
        </div>
        <div style="margin-top:14px;">
          <button class="ghost" onclick="changePassword()" id="btnChangePw">修改密码</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="viewer" onclick="this.classList.remove('on')"></div>
<div id="toasts"></div>
<script src="/web/js/api.js?v=1789439589"></script>
<script src="/web/js/common.js?v=1789439589"></script>
<script src="/web/js/router.js?v=1789439589"></script>
<script src="/web/js/projects.js?v=1789439589"></script>
<script src="/web/js/new.js?v=1789439589"></script>
<script src="/web/js/detail.js?v=1789439589"></script>
<script src="/web/js/settings.js?v=1789439589"></script>
<script src="/web/js/app.js?v=1789439589"></script>
</body>
</html>
