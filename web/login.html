<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · AI 网剧流水线</title>
<link rel="stylesheet" href="/web/css/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box {
    width: 380px; max-width: 94vw;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 30px 28px; box-shadow: 0 16px 48px rgba(0,0,0,.5);
  }
  .login-box h1 { font-size: 20px; margin-bottom: 4px; }
  .login-box .tip { font-size: 12px; color: var(--txt-3); margin-bottom: 8px; }
  .login-box button { width: 100%; margin-top: 18px; }
  .swap { font-size: 12px; color: var(--txt-3); text-align: center; margin-top: 14px; }
  .swap a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<div class="login-box">
  <h1>AI 网剧流水线</h1>
  <div class="tip" id="tip">…</div>
  <label>用户名</label>
  <input id="username" autocomplete="username" placeholder="用户名">
  <label>密码</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="密码">
  <button id="btnGo" onclick="submitAuth()">登录</button>
  <div class="swap" id="swap"></div>
</div>
<div id="toasts"></div>
<script src="/web/js/api.js"></script>
<script>
let mode = 'login';   // login | setup

async function init() {
  try {
    const s = await api('/api/auth/state');
    mode = s.has_users ? 'login' : 'setup';
  } catch { mode = 'login'; }
  render();
}

function render() {
  const tip = document.getElementById('tip'), swap = document.getElementById('swap'), btn = document.getElementById('btnGo');
  if (mode === 'setup') {
    tip.textContent = '首次使用：创建管理员账号（密码至少 6 位）';
    btn.textContent = '创建账号并进入';
    swap.innerHTML = '';
  } else {
    tip.textContent = '请登录以继续';
    btn.textContent = '登录';
    swap.innerHTML = '';
  }
}

async function submitAuth() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { toast('用户名和密码都要填', true); return; }
  const btn = document.getElementById('btnGo');
  btn.disabled = true;
  try {
    await api('/api/auth/' + (mode === 'setup' ? 'setup' : 'login'), {
      method: 'POST', body: JSON.stringify({username, password})
    });
    location.href = '/';
  } catch (e) {
    toast(e.message.replace(/^"|"$/g, ''), true);
    btn.disabled = false;
  }
}
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });
init();
</script>
</body>
</html>
